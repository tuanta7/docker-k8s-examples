apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: hello-world
  namespace: kong
  annotations:
    kubernetes.io/ingress.class: kong
plugin: hello-world

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello
  namespace: kong
  annotations:
    konghq.com/plugins: hello-world
spec:
  ingressClassName: kong
  rules:
    - http:
        paths:
          - path: /hello-world
            pathType: Exact
            backend:
              service:
                name: hello-world
                port:
                  number: 80

---
# Required Ingress backend reference. The plugin responds before proxying,
# so no backend pods or selector are needed.
apiVersion: v1
kind: Service
metadata:
  name: hello-world
  namespace: kong
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
